<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bootanimation Manager</title>
<style>
:root{--bg:#14141c;--card:#1f1f2b;--tx:#ecebf5;--mut:#9a98ad;--ac:#908dff;--bad:#ff6b6b;--ok:#6fd49a;--warn:#ffb86b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:150px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid #2b2b3a}
h1{margin:0 0 8px;font-size:19px}
h1 span{color:var(--ac)}
.row{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:8px}
#tabs .btn{flex:1 1 auto;padding:7px 6px;text-align:center}
#upd.has::after{content:' \25CF';color:#ffb020;font-size:15px;vertical-align:1px}
.row::-webkit-scrollbar{display:none}
.btn{white-space:nowrap;flex:none;border:1px solid #3a3a52;background:var(--card);color:var(--tx);border-radius:999px;padding:7px 13px;font-size:13px}
.btn.on{background:var(--ac);color:#101018;border-color:var(--ac)}
.btn.pri{background:var(--ac);color:#101018;border:0;font-weight:600}
.btn.red{background:#3a2326;border-color:#6a3338;color:#ffb3b3}
.btn.ok{background:#1f3a2c;border-color:#2c5a43;color:var(--ok)}
.btn:disabled{opacity:.45}
input[type=search],input[type=text]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #34344a;background:var(--card);color:var(--tx);font-size:15px;margin-top:8px}
.note{color:var(--mut);font-size:12.5px;margin:8px 14px}
.banner{margin:10px;padding:10px 12px;border-radius:12px;background:#3a321f;color:var(--warn);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{display:flex;gap:12px;margin:8px 10px;padding:10px;background:var(--card);border-radius:14px}
.card.active{outline:2px solid var(--ac)}
.pv{width:78px;flex:none}
.pv img,.pv .ph{width:78px;height:170px;object-fit:cover;border-radius:10px;background:#000;display:block}
.ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;text-align:center}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.nm{font-size:16px;font-weight:600;word-break:break-word}
.sub{font-size:12px;color:var(--mut);word-break:break-all}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;margin-right:4px}
.t-on{background:#1f3a2c;color:var(--ok)}.t-off{background:#2b2b3a;color:var(--mut)}.t-pend{background:#3a321f;color:var(--warn)}.t-rm{background:#3a2326;color:var(--bad)}.t-inst{background:#2b2b55;color:var(--ac)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
footer{position:fixed;left:0;right:0;bottom:0;background:#191924;border-top:1px solid #2f2f42;padding:8px 12px}
#log{white-space:pre-wrap;font:11.5px/1.35 monospace;color:var(--mut);max-height:84px;overflow:auto}
.err{color:var(--bad);padding:14px}
</style>
</head>
<body>
<header>
  <h1>Bootanimation <span>Manager</span> <button class="btn" id="lang" style="float:right;padding:4px 11px"></button></h1>
  <div class="row" id="tabs">
    <button class="btn on" data-t="inst" data-i="tInst"></button>
    <button class="btn" data-t="web" data-i="tWeb"></button>
    <button class="btn" data-t="dir" data-i="tDir"></button>
    <button class="btn" id="upd" data-i="tUpd"></button>
  </div>
  <input id="q" type="search" data-ip="search" placeholder="">
</header>
<div id="banner"></div>
<div id="top"></div>
<div id="list"></div>
<footer>
  <div id="log"></div>
</footer>

<script>
const MOD = '/data/adb/modules/oxybootanim';
const BAM = 'sh ' + MOD + '/bam.sh';
const I18N = {
 it: {tInst:'Installate', tWeb:'Online', tDir:'Da cartella', tUpd:'Aggiorna', search:'Cerca...', active:'attiva', off:'spenta', pend:'serve riavvio', rm:'da rimuovere', inst:'installata',
  playBtn:'Prova ora', useBtn:'Usa questa', rmBtn:'Rimuovi', dl:'Scarica e installa', dlUse:'Scarica e usa', installUse:'Installa e usa', oneReboot:'Basta un solo riavvio per vederla.', installBtn:'Installa', allOff:'Disattiva tutte (stock)', reboot:'Riavvia',
  needReboot:'Per applicare le modifiche serve un riavvio.', playing:'Riproduzione in corso...', noItems:'Nessuna bootanimation.', loading:'Carico...',
  askUse:'Usare questa bootanimation? Le altre verranno spente. Per vederla serve un riavvio.', askAllOff:'Spegnere tutte le bootanimation? Al riavvio tornerà quella di sistema.',
  askRm:'Rimuovere questo modulo? Sparirà al prossimo riavvio.', askReboot:'Riavviare il telefono adesso?', cancel:'Annulla', confirm:'Conferma',
  folder:'Cartella con gli zip', scan:'Cerca zip', none:'Nessuno zip di bootanimation trovato in questa cartella.', needNet:'Serve internet.',
  getting:'Preparo il download...', downloading:'Scarico...', installing:'Installo...', done:'Fatto: ', fail:'Errore: ', webNote:'Gli zip vengono scaricati da pCloud e installati spenti: poi scegli quale usare.',
  dirNote:'Metti gli zip in questa cartella del telefono e premi Cerca zip.', ofNote:'Quando uno zip viene sostituito su pCloud, il suo link smette di funzionare.', size:'MB', st:'Stato',
  updBtn:'Aggiorna app', updChecking:'Cerco aggiornamenti...', updAvail:'Aggiornamento disponibile: ', updNone:'Il Manager è già aggiornato (', updFail:'Aggiornamento non riuscito: ', updApplying:'Aggiorno il Manager...', updDone:'Aggiornato. Riapro...', askUpd:'Aggiornare il Manager? Non serve riavviare il telefono.'},
 en: {tInst:'Installed', tWeb:'Online', tDir:'From folder', tUpd:'Update', search:'Search...', active:'active', off:'off', pend:'reboot needed', rm:'to be removed', inst:'installed',
  playBtn:'Try now', useBtn:'Use this', rmBtn:'Remove', dl:'Download & install', dlUse:'Download & use', installUse:'Install & use', oneReboot:'One reboot is enough to see it.', installBtn:'Install', allOff:'Turn all off (stock)', reboot:'Reboot',
  needReboot:'A reboot is needed to apply the changes.', playing:'Playing...', noItems:'No bootanimations.', loading:'Loading...',
  askUse:'Use this bootanimation? The others will be turned off. A reboot is needed to see it.', askAllOff:'Turn off all bootanimations? The system one comes back after a reboot.',
  askRm:'Remove this module? It disappears at the next reboot.', askReboot:'Reboot the phone now?', cancel:'Cancel', confirm:'Confirm',
  folder:'Folder with the zips', scan:'Find zips', none:'No bootanimation zip found in this folder.', needNet:'Internet is required.',
  getting:'Preparing download...', downloading:'Downloading...', installing:'Installing...', done:'Done: ', fail:'Error: ', webNote:'Zips are downloaded from pCloud and installed turned off: then pick the one to use.',
  dirNote:'Put the zips in this folder on the phone and press Find zips.', ofNote:'When a zip is replaced on pCloud its link stops working.', size:'MB', st:'Status',
  updBtn:'Update app', updChecking:'Checking for updates...', updAvail:'Update available: ', updNone:'The Manager is up to date (', updFail:'Update failed: ', updApplying:'Updating the Manager...', updDone:'Updated. Reopening...', askUpd:'Update the Manager? No reboot needed.'}
};
let LANG = 'en';
try { LANG = localStorage.getItem('bam_lang') || (/^it/i.test(navigator.language || '') ? 'it' : 'en'); } catch (e) { LANG = /^it/i.test(navigator.language || '') ? 'it' : 'en'; }
const t = k => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const log = s => { const l = $('#log'); l.textContent += s + '\n'; l.scrollTop = l.scrollHeight; };
let tab = 'inst', META = {}, CAT = [], INST = [], DIRZ = [], dirPath = '/sdcard/Download/Bootanimation', needReboot = false, busy = false, UPD = null;
// latest Manager zip: GitHub first, the old public pCloud link as a fallback
const SELF_URL = 'https://raw.githubusercontent.com/tugaia56/Bootanimation-Manager/main/release/Magisk_Bootanimation_Manager_A14-A17.zip';
const SELF_CODE = 'XZHGmmJZbX9wQ2SXRTzKyzxhXTVgHbB2jeA7';
const SELF_ZIP = '/data/local/tmp/oxybam/manager-new.zip';
const parseProps = s => { const o = {}; s.split('\n').forEach(l => { const m = l.trim().match(/^(\w+)=(.*)$/); if (m) o[m[1]] = m[2]; }); return o; };

function exec(cmd) {
  return new Promise(res => {
    if (typeof ksu === 'undefined') { res({code: -1, out: '', err: 'ksu API not available'}); return; }
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    window[cb] = (code, out, err) => { delete window[cb]; res({code, out: out || '', err: err || ''}); };
    ksu.exec(cmd, '{}', cb);
  });
}
const q = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
const bam = (...a) => exec(BAM + ' ' + a.map(q).join(' '));

function ask(msg) {
  return new Promise(res => {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px';
    d.innerHTML = '<div style="background:#1f1f2b;border-radius:16px;padding:18px;max-width:420px"><div id="m" style="margin-bottom:14px"></div><div style="text-align:right"><button class="btn" id="n">' + t('cancel') + '</button> <button class="btn pri" id="y">' + t('confirm') + '</button></div></div>';
    d.querySelector('#m').textContent = msg;
    document.body.appendChild(d);
    d.querySelector('#n').onclick = () => { d.remove(); res(false); };
    d.querySelector('#y').onclick = () => { d.remove(); res(true); };
  });
}
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('[data-ip]').forEach(el => { el.placeholder = t(el.dataset.ip); });
  $('#lang').textContent = LANG === 'en' ? 'EN' : 'IT';
}
function renderBanner() {
  $('#banner').innerHTML = (UPD ? '<div class="banner"><span>' + t('updAvail') + esc(UPD.version) + '</span><button class="btn pri" id="ub">' + t('updBtn') + '</button></div>' : '') +
    (needReboot ? '<div class="banner"><span>' + t('needReboot') + '</span><button class="btn pri" id="rb">' + t('reboot') + '</button></div>' : '');
  const b = $('#rb'); if (b) b.onclick = async () => { if (await ask(t('askReboot'))) exec('reboot'); };
  const u = $('#ub'); if (u) u.onclick = applyUpdate;
  $('#upd').classList.toggle('has', !!UPD);
}
function pv(id) {
  return '<div class="pv"><img loading="lazy" src="previews/' + encodeURIComponent(id) + '.webp" onerror="this.outerHTML=\'<div class=ph>no preview</div>\'"></div>';
}
function niceName(n) { return String(n).replace(/^\s*\[?Bootanimation\]?\s*/i, ''); }

async function loadInstalled() {
  $('#list').innerHTML = '<div class="note">' + t('loading') + '</div>';
  const r = await bam('list');
  INST = r.out.split('\n').map(l => l.trim()).filter(l => l.includes('|')).map(l => { const p = l.split('|'); return {id: p[0], st: p[1], pend: p[2] === '1', name: p.slice(3).join('|')}; });
  if (INST.some(i => i.pend)) needReboot = true;
  render();
}
function render() {
  renderBanner();
  const text = $('#q').value.trim().toLowerCase();
  const out = [];
  if (tab === 'inst') {
    out.push('<div class="row" style="margin:8px 10px"><button class="btn red" id="alloff">' + t('allOff') + '</button></div>');
    const rows = INST.filter(i => !text || (i.name + i.id).toLowerCase().includes(text)).sort((a, b) => (b.st === 'on') - (a.st === 'on') || niceName(a.name).localeCompare(niceName(b.name)));
    for (const i of rows) {
      const tags = (i.st === 'on' ? '<span class="tag t-on">' + t('active') + '</span>' : i.st === 'rm' ? '<span class="tag t-rm">' + t('rm') + '</span>' : '<span class="tag t-off">' + t('off') + '</span>') + (i.pend ? '<span class="tag t-pend">' + t('pend') + '</span>' : '');
      out.push('<div class="card' + (i.st === 'on' ? ' active' : '') + '">' + pv(i.id) + '<div class="info"><div class="nm">' + esc(niceName(i.name)) + '</div><div class="sub">' + esc(i.id) + '</div><div>' + tags +
        '</div><div class="btns"><button class="btn ok" data-a="play" data-id="' + esc(i.id) + '">' + t('playBtn') + '</button><button class="btn pri" data-a="use" data-id="' + esc(i.id) + '">' + t('useBtn') + '</button><button class="btn red" data-a="rm" data-id="' + esc(i.id) + '">' + t('rmBtn') + '</button></div></div></div>');
    }
    if (!rows.length) out.push('<div class="note">' + t('noItems') + '</div>');
  } else if (tab === 'web') {
    out.push('<div class="note">' + t('webNote') + '<br>' + t('ofNote') + '</div>');
    const have = new Set(INST.map(i => i.id));
    for (const c of CAT.filter(c => !text || (c.name + c.id).toLowerCase().includes(text))) {
      const tag = have.has(c.id) ? '<span class="tag t-inst">' + t('inst') + '</span>' : '';
      out.push('<div class="card">' + pv(c.id) + '<div class="info"><div class="nm">' + esc(c.name) + '</div><div class="sub">' + (c.size / 1048576).toFixed(1) + ' ' + t('size') + '</div><div>' + tag +
        '</div><div class="btns"><button class="btn pri" data-a="dluse" data-id="' + esc(c.id) + '">' + t('dlUse') + '</button><button class="btn" data-a="dl" data-id="' + esc(c.id) + '">' + t('dl') + '</button></div></div></div>');
    }
  } else {
    out.push('<div class="note">' + t('dirNote') + '</div><div style="margin:0 10px"><input type="text" id="dirp" value="' + esc(dirPath) + '"><div class="row"><button class="btn pri" id="scan">' + t('scan') + '</button></div></div>');
    for (const z of DIRZ) {
      out.push('<div class="card"><div class="info"><div class="nm">' + esc(niceName(z.name || z.file.split('/').pop())) + '</div><div class="sub">' + esc(z.file) + ' - ' + (z.size / 1048576).toFixed(1) + ' ' + t('size') +
        '</div><div class="btns"><button class="btn pri" data-a="insuse" data-f="' + esc(z.file) + '">' + t('installUse') + '</button><button class="btn" data-a="ins" data-f="' + esc(z.file) + '">' + t('installBtn') + '</button></div></div></div>');
    }
  }
  $('#list').innerHTML = out.join('');
  const ao = $('#alloff'); if (ao) ao.onclick = async () => { if (await ask(t('askAllOff'))) { await bam('none'); needReboot = true; await loadInstalled(); } };
  const sc = $('#scan'); if (sc) sc.onclick = scanDir;
}

async function scanDir() {
  dirPath = ($('#dirp').value || dirPath).trim();
  const r = await bam('scan', dirPath);
  DIRZ = r.out.split('\n').map(l => l.trim()).filter(l => l.includes('|')).map(l => { const p = l.split('|'); return {file: p[0], size: +p[1] || 0, name: p.slice(2).join('|')}; });
  render();
  if (!DIRZ.length) log(t('none'));
}

async function installZip(file, useIt) {
  log(t('installing') + ' ' + file.split('/').pop());
  const r = await bam('install', file);
  log(r.out.trim() || r.err.trim());
  needReboot = true;
  const m = r.out.match(/id=(\S+)/);
  if (useIt && m) { const u = await bam('use', m[1]); log(u.out.trim() + ' - ' + t('oneReboot')); }
  await loadInstalled();
}
async function downloadInstall(id, useIt) {
  const c = CAT.find(x => x.id === id); if (!c) return;
  busy = true;
  try {
    log(t('getting') + ' ' + c.name);
    const a = await bam('api', c.code);
    let j; try { j = JSON.parse(a.out); } catch (e) { j = null; }
    if (!j || j.result !== 0 || !j.hosts || !j.path) { log(t('fail') + (a.out.slice(0, 120) || t('needNet'))); busy = false; return; }
    const url = 'https://' + j.hosts[0] + j.path;
    log(t('downloading') + ' (' + (c.size / 1048576).toFixed(1) + ' ' + t('size') + ')');
    const d = await bam('dl', url, c.zip);
    if (!/ok/.test(d.out)) { log(t('fail') + d.out.trim().slice(0, 160)); busy = false; return; }
    log(t('installing'));
    const r = await bam('install', '/data/local/tmp/oxybam/' + c.zip);
    log(r.out.trim().split('\n').slice(-3).join(' | '));
    needReboot = true;
    if (useIt) { const u = await bam('use', id); log(u.out.trim() + ' - ' + t('oneReboot')); }
    await bam('clean');
    log(t('done') + c.name);
  } catch (e) { log(t('fail') + e); }
  busy = false;
  await loadInstalled();
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.t) {
    tab = b.dataset.t; document.querySelectorAll('#tabs .btn').forEach(x => x.classList.toggle('on', x === b)); render(); return;
  }
  const a = b.dataset.a, id = b.dataset.id;
  if (!a || busy) return;
  if (a === 'play') {
    busy = true; b.disabled = true;
    const dur = Math.ceil((META[id] && META[id].dur) || 10) + 1;
    log(t('playing'));
    const r = await bam('play', id, String(dur));
    log(r.out.trim());
    busy = false; b.disabled = false;
  } else if (a === 'use') {
    if (!(await ask(t('askUse')))) return;
    const r = await bam('use', id); log(r.out.trim()); needReboot = true; await loadInstalled();
  } else if (a === 'rm') {
    if (!(await ask(t('askRm')))) return;
    const r = await bam('remove', id); log(r.out.trim()); needReboot = true; await loadInstalled();
  } else if (a === 'dl') {
    await downloadInstall(id, false);
  } else if (a === 'dluse') {
    await downloadInstall(id, true);
  } else if (a === 'ins') {
    await installZip(b.dataset.f, false);
  } else if (a === 'insuse') {
    await installZip(b.dataset.f, true);
  }
});
$('#q').addEventListener('input', render);
$('#lang').addEventListener('click', () => { LANG = LANG === 'en' ? 'it' : 'en'; try { localStorage.setItem('bam_lang', LANG); } catch (e) {} applyLang(); render(); });

// downloads the latest Manager zip and returns its properties (null when it cannot be reached)
async function fetchLatest() {
  let d = await bam('dl', SELF_URL + '?t=' + Date.now(), 'manager-new.zip');
  if (!/ok/.test(d.out)) {
    const a = await bam('api', SELF_CODE);
    let j; try { j = JSON.parse(a.out); } catch (e) { j = null; }
    if (!j || j.result !== 0 || !j.hosts || !j.path) return {err: a.out.trim().slice(0, 120) || t('needNet')};
    d = await bam('dl', 'https://' + j.hosts[0] + j.path, 'manager-new.zip');
    if (!/ok/.test(d.out)) return {err: d.out.trim().slice(0, 120)};
  }
  const v = parseProps((await bam('selfver', SELF_ZIP)).out);
  if (v.id !== 'oxybootanim') return {err: 'bad zip'};
  return v;
}
async function checkUpdate(manual) {
  if (busy) return;
  busy = true;
  try {
    if (manual) log(t('updChecking'));
    const cur = parseProps((await bam('selfver')).out);
    const nw = await fetchLatest();
    if (nw.err) { if (manual) log(t('updFail') + nw.err); }
    else if ((+nw.versionCode || 0) > (+cur.versionCode || 0)) { UPD = nw; renderBanner(); log(t('updAvail') + nw.version); }
    else { UPD = null; renderBanner(); if (manual) log(t('updNone') + (cur.version || '?') + ')'); }
    try { localStorage.setItem('bam_upd_check', String(Date.now())); } catch (e) {}
    try { if (UPD) localStorage.setItem('bam_upd_cache', JSON.stringify({version: UPD.version, versionCode: UPD.versionCode})); else if (!nw.err) localStorage.removeItem('bam_upd_cache'); } catch (e) {}
    await bam('clean');
  } catch (e) { if (manual) log(t('updFail') + e); }
  busy = false;
}
async function applyUpdate() {
  if (busy) return;
  if (!(await ask(t('askUpd')))) return;
  busy = true;
  try {
    log(t('updApplying'));
    const nw = await fetchLatest();      // download again: the temporary folder may have been cleaned meanwhile
    if (nw.err) { log(t('updFail') + nw.err); busy = false; return; }
    const r = await bam('selfapply', SELF_ZIP);
    if (!/ok/.test(r.out)) { log(t('updFail') + (r.out.trim() || r.err.trim())); busy = false; return; }
    await bam('clean');
    log(t('updDone'));
    setTimeout(() => location.reload(), 1200);
  } catch (e) { log(t('updFail') + e); busy = false; }
}

async function init() {
  applyLang();
  try { META = await (await fetch('meta.json')).json(); } catch (e) {}
  try { CAT = await (await fetch('catalog.json')).json(); } catch (e) {}
  await loadInstalled();
  // an update found earlier shows its dot / banner right away, before any new check
  try {
    const c = JSON.parse(localStorage.getItem('bam_upd_cache') || 'null');
    if (c) {
      const cur = parseProps((await bam('selfver')).out);
      if ((+c.versionCode || 0) > (+cur.versionCode || 0)) { UPD = c; renderBanner(); }
      else localStorage.removeItem('bam_upd_cache');
    }
  } catch (e) {}
  // silent update check every time the Manager is opened (at most every 15 minutes)
  let last = 0; try { last = +localStorage.getItem('bam_upd_check') || 0; } catch (e) {}
  if (Date.now() - last > 15 * 60 * 1000) checkUpdate(false);
}
$('#upd').addEventListener('click', () => checkUpdate(true));
init();
</script>
</body>
</html>
